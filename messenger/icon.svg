<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#grad1)"/>

  <!-- Lock icon -->
  <g transform="translate(256, 256)">
    <!-- Lock body -->
    <rect x="-80" y="0" width="160" height="120" rx="20" fill="white" opacity="0.95"/>

    <!-- Lock shackle -->
    <path d="M -60,-80 Q -60,-140 0,-140 Q 60,-140 60,-80 L 60,0 L 40,0 L 40,-80 Q 40,-120 0,-120 Q -40,-120 -40,-80 L -40,0 L -60,0 Z" fill="white" opacity="0.95"/>

    <!-- Keyhole -->
    <circle cx="0" cy="50" r="18" fill="#667eea"/>
    <rect x="-8" y="50" width="16" height="35" rx="3" fill="#667eea"/>

    <!-- Chat bubble accent -->
    <circle cx="100" cy="-100" r="35" fill="white" opacity="0.3"/>
    <circle cx="115" cy="-85" r="20" fill="white" opacity="0.3"/>
  </g>
</svg>
